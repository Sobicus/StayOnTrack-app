events {
    worker_connections 1024;
}

http {
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    # Upstream services (Docker service names)
    upstream api { server api:4800; }
    upstream web { server web:4801; }

    # ─────────────────────────────────────────────────────────────────
    # STEP 1: HTTP only — used during initial deploy + certbot challenge
    # After getting SSL cert: replace this block with the HTTPS blocks below
    # ─────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name stayontrack.day www.stayontrack.day api.stayontrack.day;

        # Let's Encrypt challenge (always keep this)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Temporary: serve directly on HTTP for first deploy verification
        # After SSL is ready — replace everything below with: return 301 https://$host$request_uri;

        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ─────────────────────────────────────────────────────────────────
